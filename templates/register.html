<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
</head>
<body>
    <h2>Registration Form</h2>

    <form action="/register" method="POST">
        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Roll No:</label>
        <input type="text" name="roll_no" required>
        <br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
